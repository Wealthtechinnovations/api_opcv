name: AfricaFunds S2 Secret Inventory

on:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - 'scripts/governance/s2_secret_inventory.py'
      - 'scripts/governance/prepare_s2_ssh.sh'
      - '.governance/ssh/s2_known_hosts.tofu'
      - '.github/workflows/governance-s2-secret-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: africafunds-s2-secret-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical governance
        uses: actions/checkout@v4
        with:
          ref: claude/code-review-improvements-ikvuj

      - name: Prepare strict pinned SSH
        env:
          S2_HOST: ${{ secrets.S2_HOST }}
          S2_SSH_KEY: ${{ secrets.S2_SSH_KEY }}
          S2_KNOWN_HOSTS: ${{ secrets.S2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash scripts/governance/prepare_s2_ssh.sh

      - name: Inventory runtime secret loading without values
        env:
          HOST: ${{ secrets.S2_HOST }}
          USER_SSH: ${{ secrets.S2_USER }}
        run: |
          set -euo pipefail
          SSH_USER="${USER_SSH:-root}"
          ssh -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$HOST" \
            'python3 -' < scripts/governance/s2_secret_inventory.py > S2_SECRET_INVENTORY.json

      - name: Validate non-disclosure contract
        run: |
          set -euo pipefail
          python3 -m json.tool S2_SECRET_INVENTORY.json >/dev/null
          python3 - <<'PY'
          import json
          p=json.load(open('S2_SECRET_INVENTORY.json',encoding='utf-8'))
          assert p['project_uid']=='CS-AFRICAFUNDS-001'
          assert p['safety']['read_only'] is True
          assert p['safety']['values_exposed'] is False
          assert p['safety']['hashes_of_secret_values_exposed'] is False
          assert p['safety']['files_modified'] is False
          assert p['safety']['services_restarted'] is False
          print('S2_SECRET_INVENTORY=PASS')
          PY

      - name: Publish safe summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          print('## AfricaFunds — S2 secret inventory')
          pth=pathlib.Path('S2_SECRET_INVENTORY.json')
          if not pth.exists():
              print('Inventory unavailable; see job logs.')
          else:
              p=json.loads(pth.read_text())
              f=p['files'].get('.env',{})
              print('- .env exists:', f.get('exists'))
              print('- .env tracked:', f.get('tracked_by_git'))
              print('- .env clean:', f.get('git_status')==[])
              print('- .env matches HEAD:', f.get('matches_git_head'))
              print('- sensitive non-placeholder key names:', ', '.join(f.get('sensitive_nonplaceholder_keys',[])))
              print('- code consumer count:', p.get('code_consumer_count'))
              print('- runtime env ignored if untracked:', p.get('migration_preconditions',{}).get('runtime_env_ignored_if_untracked'))
          PY

      - name: Upload safe machine-readable inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africafunds-s2-secret-inventory
          path: S2_SECRET_INVENTORY.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
