name: AfricaFunds Programme Director

on:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - 'scripts/governance/program_orchestrator.py'
      - 'scripts/governance/program_event_ledger.py'
      - 'scripts/governance/program_gap_harvester.py'
      - 'scripts/governance/program_surface_claims.py'
      - 'scripts/governance/program_invariants.py'
      - 'scripts/governance/program_projection_drift.py'
      - 'scripts/governance/program_projection_generator.py'
      - 'scripts/governance/program_projection_writeback_simulator.py'
      - 'scripts/governance/program_projection_writeback.py'
      - '.governance/project.json'
      - '.governance/loop/task-queue.json'
      - '.governance/loop/state.json'
      - '.governance/loop/handoff.json'
      - '.governance/knowledge/evidence.json'
      - '.governance/incidents/registry.json'
      - 'NEXT_ACTION.md'
      - 'CURRENT_ITERATION.md'
      - 'LOOP_STATE.md'
      - 'HANDOFF.md'
      - 'STATUS.md'
      - '.github/workflows/governance-program-director.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: africafunds-programme-director
  cancel-in-progress: false

jobs:
  derive:
    name: Derive current AfricaFunds programme state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout API triggering SHA
        uses: actions/checkout@v4
        with:
          path: api
          fetch-depth: 1

      - name: Checkout frontend canonical branch
        uses: actions/checkout@v4
        with:
          repository: Wealthtechinnovations/front_end_opcvm
          ref: claude/code-review-improvements-ikvuj
          path: frontend
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Derive programme state read-only
        run: |
          set -euo pipefail
          mkdir -p out
          python3 api/scripts/governance/program_orchestrator.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-director.json \
            | tee out/program-director.log

      - name: Build derived chronological ledger
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_event_ledger.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-events.json \
            | tee out/program-events.log

      - name: Harvest candidate gaps read-only
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_gap_harvester.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-gaps.json \
            | tee out/program-gaps.log

      - name: Validate multi-agent surface claims observe-only
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_surface_claims.py \
            --api-root api \
            --output out/program-surface-claims.json \
            | tee out/program-surface-claims.log

      - name: Enforce existing anti-regression invariants
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_invariants.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-invariants.json \
            | tee out/program-invariants.log

      - name: Enforce human projection alignment fail-closed
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_projection_drift.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-projection-drift.json \
            | tee out/program-projection-drift.log

      - name: Generate projection candidates twice observe-only
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_projection_generator.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-projection-generator-a.json \
            > out/program-projection-generator-a.log
          python3 api/scripts/governance/program_projection_generator.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-projection-generator-b.json \
            > out/program-projection-generator-b.log
          cmp -s out/program-projection-generator-a.json out/program-projection-generator-b.json
          cp out/program-projection-generator-a.json out/program-projection-generator.json
          echo "PROJECTION_GENERATOR_DETERMINISM=PASS"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("out/program-projection-generator.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          print("PROJECTION_GENERATOR_MODE="+str(d.get("mode")))
          print("PROJECTION_GENERATOR_WRITE_PERFORMED="+str(d.get("repository_write_performed")))
          print("PROJECTION_GENERATOR_INPUT_SHA256="+str(d.get("input_sha256")))
          print("PROJECTION_GENERATOR_WRITEBACK_CANDIDATES="+str(d.get("writeback_candidate_count")))
          print("PROJECTION_GENERATOR_EXACT_PRESENT="+str(d.get("exact_present_count")))
          PY

      - name: Simulate managed projection writeback in memory
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_projection_writeback_simulator.py \
            --api-root api \
            --frontend-root frontend \
            --generator-json out/program-projection-generator.json \
            --output out/program-projection-writeback-sim.json \
            | tee out/program-projection-writeback-sim.log

      - name: Test governed projection writeback engine
        run: |
          set -euo pipefail
          API_SHA="$(git -C api rev-parse HEAD)"
          FRONT_SHA="$(git -C frontend rev-parse HEAD)"

          set +e
          python3 api/scripts/governance/program_projection_writeback.py \
            --api-root api \
            --frontend-root frontend \
            --generator-json out/program-projection-generator.json \
            --expected-api-sha 0000000000000000000000000000000000000000 \
            --expected-frontend-sha "$FRONT_SHA" \
            --task-id AF-TASK-027 \
            --output out/program-writeback-head-mismatch.json \
            > out/program-writeback-head-mismatch.log 2>&1
          mismatch_rc=$?
          set -e
          test "$mismatch_rc" -ne 0
          python3 - <<'PY'
          import json
          d=json.load(open("out/program-writeback-head-mismatch.json",encoding="utf-8"))
          assert "API_HEAD_MISMATCH" in d.get("errors",[]), d
          print("WRITEBACK_ENGINE_HEAD_MISMATCH_RED=PASS")
          PY

          python3 api/scripts/governance/program_projection_writeback.py \
            --api-root api \
            --frontend-root frontend \
            --generator-json out/program-projection-generator.json \
            --expected-api-sha "$API_SHA" \
            --expected-frontend-sha "$FRONT_SHA" \
            --task-id AF-TASK-027 \
            --output out/program-writeback-dry-run.json \
            > out/program-writeback-dry-run.log

          python3 - <<'PY'
          import json
          d=json.load(open("out/program-writeback-dry-run.json",encoding="utf-8"))
          assert d["integrity"]=="PASS", d
          assert d["mode"]=="DRY_RUN_ONLY", d
          assert d["files_written_count"]==0, d
          assert d["repository_git_push_performed"] is False, d
          assert d["runtime_deploy_performed"] is False, d
          print("WRITEBACK_ENGINE_DRY_RUN=PASS")
          PY

          TMP="$(mktemp -d)"
          trap 'git -C api worktree remove --force "$TMP/api" >/dev/null 2>&1 || true; git -C frontend worktree remove --force "$TMP/frontend" >/dev/null 2>&1 || true; rm -rf "$TMP"' EXIT
          git -C api worktree add --detach "$TMP/api" "$API_SHA" >/dev/null
          git -C frontend worktree add --detach "$TMP/frontend" "$FRONT_SHA" >/dev/null

          python3 - "$TMP/api" "$TMP/frontend" <<'PY'
          import sys
          from pathlib import Path
          api=Path(sys.argv[1])
          front=Path(sys.argv[2])
          begin="<!-- PROGRAMME_DIRECTOR:BEGIN -->"
          end="<!-- PROGRAMME_DIRECTOR:END -->"
          files=[
              api/"NEXT_ACTION.md",
              api/"CURRENT_ITERATION.md",
              api/"LOOP_STATE.md",
              api/"HANDOFF.md",
              api/"STATUS.md",
              front/"SUIVI.md",
          ]
          stale=begin+"\n### Projection gérée — stale test fixture\n\n- stale: `YES`\n\n"+end
          for p in files:
              text=p.read_text(encoding="utf-8")
              assert text.count(begin)==1 and text.count(end)==1, p
              s=text.index(begin)
              e=text.index(end,s)+len(end)
              p.write_text(text[:s]+stale+text[e:],encoding="utf-8")
          print("WRITEBACK_ENGINE_TEMP_STALE_FIXTURE=PASS")
          PY

          python3 "$TMP/api/scripts/governance/program_projection_writeback.py" \
            --api-root "$TMP/api" \
            --frontend-root "$TMP/frontend" \
            --generator-json "$GITHUB_WORKSPACE/out/program-projection-generator.json" \
            --expected-api-sha "$API_SHA" \
            --expected-frontend-sha "$FRONT_SHA" \
            --task-id AF-TASK-027 \
            --output out/program-writeback-apply-a.json \
            --apply \
            > out/program-writeback-apply-a.log

          python3 "$TMP/api/scripts/governance/program_projection_writeback.py" \
            --api-root "$TMP/api" \
            --frontend-root "$TMP/frontend" \
            --generator-json "$GITHUB_WORKSPACE/out/program-projection-generator.json" \
            --expected-api-sha "$API_SHA" \
            --expected-frontend-sha "$FRONT_SHA" \
            --task-id AF-TASK-027 \
            --output out/program-writeback-apply-b.json \
            --apply \
            > out/program-writeback-apply-b.log

          python3 - <<'PY'
          import json
          a=json.load(open("out/program-writeback-apply-a.json",encoding="utf-8"))
          b=json.load(open("out/program-writeback-apply-b.json",encoding="utf-8"))
          assert a["integrity"]=="PASS", a
          assert a["mode"]=="APPLY_LOCAL_ONLY", a
          assert a["projection_count"]==6, a
          assert a["changed_count"]==6, a
          assert a["files_written_count"]==6, a
          assert a["all_outside_content_preserved"] is True, a
          assert a["all_markers_valid"] is True, a
          assert a["repository_git_push_performed"] is False, a
          assert a["runtime_deploy_performed"] is False, a
          assert b["integrity"]=="PASS", b
          assert b["changed_count"]==0, b
          assert b["files_written_count"]==0, b
          assert b["all_second_apply_idempotent"] is True, b
          print("WRITEBACK_ENGINE_TEMP_APPLY_GREEN=PASS")
          print("WRITEBACK_ENGINE_IDEMPOTENCE=PASS")
          PY

      - name: Publish programme summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          p=Path("out/program-director.json")
          print("## AfricaFunds Programme Director")
          print()
          print("- mode: DERIVED_READ_ONLY")
          print("- task authority: .governance/loop/task-queue.json")
          print("- second queue created: NO")
          if not p.exists():
              print("- result: NO_REPORT")
              raise SystemExit(0)
          data=json.loads(p.read_text(encoding="utf-8"))
          integ=data.get("integrity",{})
          print("- integrity:",integ.get("status"))
          fs=data.get("fund_state",{})
          print("- API SHA:",fs.get("API_SHA"))
          print("- frontend SHA:",fs.get("FRONTEND_SHA"))
          op=data.get("operational_priority",{})
          print("- operational priority:",op.get("task_id"),op.get("phase"),op.get("status"))
          print("- ready:",", ".join(data.get("ready",[])) or "none")
          print("- running:",", ".join(data.get("running",[])) or "none")
          print("- waiting for evidence:",", ".join(data.get("waiting_for_evidence",[])) or "none")
          print("- blocked count:",len(data.get("blocked",[])))
          print("- parallel candidates (dependency-only):",", ".join(data.get("parallel_candidates_dependency_only",[])) or "none")
          print()
          print("### Dependency waves")
          for row in data.get("dependency_waves",[]):
              print("- wave",row.get("wave"),":",", ".join(row.get("task_ids",[])))
          if integ.get("errors"):
              print()
              print("### Errors")
              for e in integ["errors"]:
                  print("-",e)
          if integ.get("warnings"):
              print()
              print("### Warnings")
              for e in integ["warnings"]:
                  print("-",e)

          ep=Path("out/program-events.json")
          if ep.exists():
              events=json.loads(ep.read_text(encoding="utf-8"))
              print()
              print("### Latest programme events")
              for row in events.get("latest_events",[])[-12:]:
                  print("-",row.get("at"),row.get("kind"),row.get("ref"),row.get("result") or row.get("summary"))

          gp=Path("out/program-gaps.json")
          if gp.exists():
              gaps=json.loads(gp.read_text(encoding="utf-8"))
              print()
              print("### Gap harvester")
              print("- task creation performed:",gaps.get("task_creation_performed"))
              print("- candidates:",gaps.get("candidate_count"))
              print("- possible existing task matches:",gaps.get("candidate_with_possible_existing_task"))
              print("- unmatched candidates:",gaps.get("candidate_without_possible_existing_task"))
              for row in gaps.get("inventory",[]):
                  print("- inventory",row.get("role"),row)

          cp=Path("out/program-surface-claims.json")
          if cp.exists():
              claims=json.loads(cp.read_text(encoding="utf-8"))
              print()
              print("### Multi-agent surface claims")
              print("- mode:",claims.get("mode"))
              print("- integrity:",claims.get("integrity"))
              print("- active claims:",claims.get("active_claim_count"))
              print("- conflicts:",claims.get("conflict_count"))
              print("- certified parallel pairs:",len(claims.get("surface_certified_parallel_pairs",[])))
              print("- advisories:",len(claims.get("advisories",[])))

          ip=Path("out/program-invariants.json")
          if ip.exists():
              invariants=json.loads(ip.read_text(encoding="utf-8"))
              print()
              print("### Anti-regression invariants")
              print("- mode:",invariants.get("mode"))
              print("- integrity:",invariants.get("integrity"))
              print("- errors:",invariants.get("error_count"))
              print("- warnings:",invariants.get("warning_count"))
              print("- operational priority:",invariants.get("operational_priority"))

          dp=Path("out/program-projection-drift.json")
          if dp.exists():
              drift=json.loads(dp.read_text(encoding="utf-8"))
              print()
              print("### Human projection drift")
              print("- mode:",drift.get("mode"))
              print("- machine integrity:",drift.get("integrity"))
              print("- projection drift count:",drift.get("projection_drift_count"))
              for row in drift.get("projection_drifts",[]):
                  print("-",row.get("projection"),"missing",row.get("missing_tokens"))

          pg=Path("out/program-projection-generator.json")
          if pg.exists():
              gen=json.loads(pg.read_text(encoding="utf-8"))
              print()
              print("### Projection generator")
              print("- mode:",gen.get("mode"))
              print("- repository write performed:",gen.get("repository_write_performed"))
              print("- input sha256:",gen.get("input_sha256"))
              print("- writeback candidates:",gen.get("writeback_candidate_count"))
              print("- exact managed blocks present:",gen.get("exact_present_count"))

          sp=Path("out/program-projection-writeback-sim.json")
          if sp.exists():
              sim=json.loads(sp.read_text(encoding="utf-8"))
              print()
              print("### Projection writeback simulation")
              print("- mode:",sim.get("mode"))
              print("- integrity:",sim.get("integrity"))
              print("- repository write performed:",sim.get("repository_write_performed"))
              print("- projections:",sim.get("projection_count"))
              print("- outside content preserved:",sim.get("all_outside_content_preserved"))
              print("- second apply idempotent:",sim.get("all_second_apply_idempotent"))
              print("- marker counts valid:",sim.get("all_marker_counts_valid"))

          ep=Path("out/program-writeback-dry-run.json")
          if ep.exists():
              eng=json.loads(ep.read_text(encoding="utf-8"))
              print()
              print("### Governed writeback engine")
              print("- dry-run integrity:",eng.get("integrity"))
              print("- dry-run changed count:",eng.get("changed_count"))
              print("- files written:",eng.get("files_written_count"))
              print("- git push performed:",eng.get("repository_git_push_performed"))
              print("- runtime deploy performed:",eng.get("runtime_deploy_performed"))
          PY

      - name: Upload derived programme state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africafunds-programme-director-${{ github.run_id }}
          path: |
            out/program-director.json
            out/program-director.log
            out/program-events.json
            out/program-events.log
            out/program-gaps.json
            out/program-gaps.log
            out/program-surface-claims.json
            out/program-surface-claims.log
            out/program-invariants.json
            out/program-invariants.log
            out/program-projection-drift.json
            out/program-projection-drift.log
            out/program-projection-generator.json
            out/program-projection-generator-a.json
            out/program-projection-generator-b.json
            out/program-projection-generator-a.log
            out/program-projection-generator-b.log
            out/program-projection-writeback-sim.json
            out/program-projection-writeback-sim.log
            out/program-writeback-head-mismatch.json
            out/program-writeback-head-mismatch.log
            out/program-writeback-dry-run.json
            out/program-writeback-dry-run.log
            out/program-writeback-apply-a.json
            out/program-writeback-apply-a.log
            out/program-writeback-apply-b.json
            out/program-writeback-apply-b.log
          if-no-files-found: warn
          retention-days: 30
