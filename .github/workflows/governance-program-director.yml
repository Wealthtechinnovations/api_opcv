name: AfricaFunds Programme Director

on:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - 'scripts/governance/program_orchestrator.py'
      - 'scripts/governance/program_event_ledger.py'
      - 'scripts/governance/program_gap_harvester.py'
      - 'scripts/governance/program_surface_claims.py'
      - 'scripts/governance/program_invariants.py'
      - 'scripts/governance/program_projection_drift.py'
      - '.governance/project.json'
      - '.governance/loop/task-queue.json'
      - '.governance/loop/state.json'
      - '.governance/loop/handoff.json'
      - '.governance/knowledge/evidence.json'
      - '.governance/incidents/registry.json'
      - 'NEXT_ACTION.md'
      - 'CURRENT_ITERATION.md'
      - 'LOOP_STATE.md'
      - 'HANDOFF.md'
      - 'STATUS.md'
      - '.github/workflows/governance-program-director.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: africafunds-programme-director
  cancel-in-progress: false

jobs:
  derive:
    name: Derive current AfricaFunds programme state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout API triggering SHA
        uses: actions/checkout@v4
        with:
          path: api
          fetch-depth: 1

      - name: Checkout frontend canonical branch
        uses: actions/checkout@v4
        with:
          repository: Wealthtechinnovations/front_end_opcvm
          ref: claude/code-review-improvements-ikvuj
          path: frontend
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Derive programme state read-only
        run: |
          set -euo pipefail
          mkdir -p out
          python3 api/scripts/governance/program_orchestrator.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-director.json \
            | tee out/program-director.log

      - name: Build derived chronological ledger
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_event_ledger.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-events.json \
            | tee out/program-events.log

      - name: Harvest candidate gaps read-only
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_gap_harvester.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-gaps.json \
            | tee out/program-gaps.log

      - name: Validate multi-agent surface claims observe-only
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_surface_claims.py \
            --api-root api \
            --output out/program-surface-claims.json \
            | tee out/program-surface-claims.log

      - name: Enforce existing anti-regression invariants
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_invariants.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-invariants.json \
            | tee out/program-invariants.log

      - name: Detect human projection drift observe-only
        run: |
          set -euo pipefail
          python3 api/scripts/governance/program_projection_drift.py \
            --api-root api \
            --frontend-root frontend \
            --output out/program-projection-drift.json \
            | tee out/program-projection-drift.log

      - name: Publish programme summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          p=Path("out/program-director.json")
          print("## AfricaFunds Programme Director")
          print()
          print("- mode: DERIVED_READ_ONLY")
          print("- task authority: .governance/loop/task-queue.json")
          print("- second queue created: NO")
          if not p.exists():
              print("- result: NO_REPORT")
              raise SystemExit(0)
          data=json.loads(p.read_text(encoding="utf-8"))
          integ=data.get("integrity",{})
          print("- integrity:",integ.get("status"))
          fs=data.get("fund_state",{})
          print("- API SHA:",fs.get("API_SHA"))
          print("- frontend SHA:",fs.get("FRONTEND_SHA"))
          op=data.get("operational_priority",{})
          print("- operational priority:",op.get("task_id"),op.get("phase"),op.get("status"))
          print("- ready:",", ".join(data.get("ready",[])) or "none")
          print("- running:",", ".join(data.get("running",[])) or "none")
          print("- waiting for evidence:",", ".join(data.get("waiting_for_evidence",[])) or "none")
          print("- blocked count:",len(data.get("blocked",[])))
          print("- parallel candidates (dependency-only):",", ".join(data.get("parallel_candidates_dependency_only",[])) or "none")
          print()
          print("### Dependency waves")
          for row in data.get("dependency_waves",[]):
              print("- wave",row.get("wave"),":",", ".join(row.get("task_ids",[])))
          if integ.get("errors"):
              print()
              print("### Errors")
              for e in integ["errors"]:
                  print("-",e)
          if integ.get("warnings"):
              print()
              print("### Warnings")
              for e in integ["warnings"]:
                  print("-",e)

          ep=Path("out/program-events.json")
          if ep.exists():
              events=json.loads(ep.read_text(encoding="utf-8"))
              print()
              print("### Latest programme events")
              for row in events.get("latest_events",[])[-12:]:
                  print("-",row.get("at"),row.get("kind"),row.get("ref"),row.get("result") or row.get("summary"))

          gp=Path("out/program-gaps.json")
          if gp.exists():
              gaps=json.loads(gp.read_text(encoding="utf-8"))
              print()
              print("### Gap harvester")
              print("- task creation performed:",gaps.get("task_creation_performed"))
              print("- candidates:",gaps.get("candidate_count"))
              print("- possible existing task matches:",gaps.get("candidate_with_possible_existing_task"))
              print("- unmatched candidates:",gaps.get("candidate_without_possible_existing_task"))
              for row in gaps.get("inventory",[]):
                  print("- inventory",row.get("role"),row)

          cp=Path("out/program-surface-claims.json")
          if cp.exists():
              claims=json.loads(cp.read_text(encoding="utf-8"))
              print()
              print("### Multi-agent surface claims")
              print("- mode:",claims.get("mode"))
              print("- integrity:",claims.get("integrity"))
              print("- active claims:",claims.get("active_claim_count"))
              print("- conflicts:",claims.get("conflict_count"))
              print("- certified parallel pairs:",len(claims.get("surface_certified_parallel_pairs",[])))
              print("- advisories:",len(claims.get("advisories",[])))

          ip=Path("out/program-invariants.json")
          if ip.exists():
              invariants=json.loads(ip.read_text(encoding="utf-8"))
              print()
              print("### Anti-regression invariants")
              print("- mode:",invariants.get("mode"))
              print("- integrity:",invariants.get("integrity"))
              print("- errors:",invariants.get("error_count"))
              print("- warnings:",invariants.get("warning_count"))
              print("- operational priority:",invariants.get("operational_priority"))

          dp=Path("out/program-projection-drift.json")
          if dp.exists():
              drift=json.loads(dp.read_text(encoding="utf-8"))
              print()
              print("### Human projection drift")
              print("- mode:",drift.get("mode"))
              print("- machine integrity:",drift.get("integrity"))
              print("- projection drift count:",drift.get("projection_drift_count"))
              for row in drift.get("projection_drifts",[]):
                  print("-",row.get("projection"),"missing",row.get("missing_tokens"))
          PY

      - name: Upload derived programme state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africafunds-programme-director-${{ github.run_id }}
          path: |
            out/program-director.json
            out/program-director.log
            out/program-events.json
            out/program-events.log
            out/program-gaps.json
            out/program-gaps.log
          if-no-files-found: warn
          retention-days: 30
