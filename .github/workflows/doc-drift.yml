# Boucle de controle — derive documentation / production
#
# Execute `scripts/diag/check_doc_drift.js` sur le serveur de production et
# publie le resultat dans le resume du job. Le script est en LECTURE SEULE
# (uniquement des SELECT) : ce workflow ne modifie ni la base, ni le code, ni
# le service.
#
# Pourquoi ce workflow existe
# ---------------------------
# La memoire du projet etait en prose, dans 33 fichiers .md. Un document
# pouvait affirmer une contre-verite pendant des mois sans que rien ne
# proteste (cf. CODE_REVIEW #34, « UEMOA stale 233 jours », faux sur les deux
# points). Ce workflow rend la verification automatique et bruyante.
#
# Declenchement
#   - bouton "Run workflow" dans l'onglet Actions (aucune ligne de commande) ;
#   - automatiquement chaque matin a 06h00 UTC ;
#   - a chaque modification du script de controle.
#
# Secrets requis (deja crees sur le depot) :
#   S2_HOST     adresse du serveur de production
#   S2_SSH_KEY  cle privee SSH (contenu complet, en-tetes inclus)
#   S2_USER     optionnel — utilisateur SSH, "root" par defaut

name: Controle derive prod/doc

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  push:
    paths:
      - 'scripts/diag/check_doc_drift.js'
      - '.github/workflows/doc-drift.yml'

# Lecture seule : le job n'a besoin d'aucun droit d'ecriture sur le depot.
permissions:
  contents: read

concurrency:
  group: doc-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Verifier les invariants de production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verifier que les secrets sont configures
        env:
          HOST: ${{ secrets.S2_HOST }}
          KEY: ${{ secrets.S2_SSH_KEY }}
        run: |
          # On teste seulement la PRESENCE, jamais la valeur : rien n'est affiche.
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::Secrets manquants. Renseigner S2_HOST et S2_SSH_KEY dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secrets presents."

      - name: Preparer la connexion SSH
        env:
          HOST: ${{ secrets.S2_HOST }}
          KEY: ${{ secrets.S2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # La cle est ecrite hors des logs et en droits restreints.
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Empreinte du serveur relevee puis epinglee : evite d'avoir a
          # desactiver la verification d'hote.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Executer le controle sur la production
        id: check
        env:
          HOST: ${{ secrets.S2_HOST }}
          USER_SSH: ${{ secrets.S2_USER }}
        run: |
          # Les etapes GitHub tournent en `bash -eo pipefail` : si le controle
          # sort en code 1 (echec critique), cette etape echoue et le job devient
          # rouge. C'est exactement l'effet recherche — l'etape de rapport qui
          # suit porte `if: always()` et publie quand meme le detail.
          SSH_USER="${USER_SSH:-root}"

          # Le depot serveur porte en permanence des fichiers modifies (logs.txt
          # notamment) : on met de cote, on met a jour, on remet en place.
          # Aucune donnee n'est perdue et rien n'est ecrase de force.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HOST" bash -s <<'REMOTE' 2>&1 | tee rapport.txt
            set -u
            cd /var/www/vhosts/chainsolutions.fr/africafunds.chainsolutions.fr/api || exit 3

            STASHED=0
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push -m "ci-autostash-$(date +%Y%m%d_%H%M%S)" >/dev/null && STASHED=1
            fi

            git pull --rebase origin claude/code-review-improvements-ikvuj >/dev/null 2>&1 \
              || echo "AVERTISSEMENT: mise a jour du code impossible, controle lance sur la version presente."

            [ "$STASHED" = "1" ] && git stash pop >/dev/null 2>&1

            node scripts/diag/check_doc_drift.js --verbose
          REMOTE

      - name: Publier le rapport
        if: always()
        run: |
          {
            echo "## Controle derive production / documentation"
            echo
            echo "Execute le $(date -u '+%Y-%m-%d %H:%M UTC') sur la production. Lecture seule."
            echo
            echo '```'
            cat rapport.txt 2>/dev/null || echo "(aucune sortie — la connexion a echoue)"
            echo '```'
            echo
            echo "Un ECHEC signifie que la production contredit ce que la documentation affirme."
            echo "Corriger l'un ou l'autre, puis consigner dans SUIVI.md > POINT DE REPRISE COURANT."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Effacer la cle SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
