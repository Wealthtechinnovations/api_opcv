# GOV-006 post-documentation reconciliation trigger — 2026-09-10
name: Reconciliation gouvernee GitHub S2

on:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - '.github/workflows/governance-s2-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-s2-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconciler S2 sans perte ni reset destructif
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verifier les secrets S2
        env:
          HOST: ${{ secrets.S2_HOST }}
          KEY: ${{ secrets.S2_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo '::error::Secrets S2_HOST ou S2_SSH_KEY manquants.'
            exit 1
          fi

      - name: Preparer SSH
        env:
          HOST: ${{ secrets.S2_HOST }}
          KEY: ${{ secrets.S2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Reconciliation atomique et sauvegardee
        env:
          HOST: ${{ secrets.S2_HOST }}
          USER_SSH: ${{ secrets.S2_USER }}
        run: |
          set -euo pipefail
          SSH_USER="${USER_SSH:-root}"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail

            BRANCH='claude/code-review-improvements-ikvuj'
            API='/var/www/vhosts/chainsolutions.fr/africafunds.chainsolutions.fr/api'
            FRONT='/var/www/vhosts/chainsolutions.fr/africafunds.chainsolutions.fr/frontend'
            TS="$(date -u '+%Y%m%dT%H%M%SZ')"
            BACKUP="/var/backups/fundafrica-governance/$TS"
            mkdir -p "$BACKUP/api" "$BACKUP/frontend"
            chmod 700 "$BACKUP"

            echo "backup_dir=$BACKUP"

            # -----------------------------------------------------------------
            # API — preflight strict : aucun changement tracked et tous les
            # commits locaux exclusifs doivent etre des snapshots uniquement.
            # -----------------------------------------------------------------
            cd "$API"
            test "$(git branch --show-current)" = "$BRANCH"
            API_START="$(git rev-parse HEAD)"
            git status -sb > "$BACKUP/api/status-before.txt"
            git log --format='%H | %cI | %s' -n 80 > "$BACKUP/api/log-before.txt"
            cp -a PRODUCTION_STATE.json "$BACKUP/api/PRODUCTION_STATE.before.json" 2>/dev/null || true

            TRACKED_DIRTY="$(git status --porcelain=v1 | grep -v '^?? ' || true)"
            if [ -n "$TRACKED_DIRTY" ]; then
              echo '::error::API contient des modifications tracked non commitees.'
              printf '%s\n' "$TRACKED_DIRTY"
              exit 20
            fi

            git fetch --prune origin "$BRANCH"
            API_REMOTE="$(git rev-parse "origin/$BRANCH")"
            API_REMOTE_LS="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
            test "$API_REMOTE" = "$API_REMOTE_LS"

            SNAPSHOT_ONLY=0
            OTHER=0
            while IFS= read -r C; do
              [ -n "$C" ] || continue
              FILES="$(git diff-tree --no-commit-id --name-only -r "$C" | sed '/^$/d')"
              COUNT="$(printf '%s\n' "$FILES" | sed '/^$/d' | wc -l | tr -d ' ')"
              if [ "$COUNT" = '1' ] && [ "$FILES" = 'PRODUCTION_STATE.json' ]; then
                SNAPSHOT_ONLY=$((SNAPSHOT_ONLY + 1))
              else
                OTHER=$((OTHER + 1))
                echo "UNSAFE_COMMIT=$C files=$(printf '%s' "$FILES" | tr '\n' ',')"
              fi
            done < <(git rev-list "origin/$BRANCH..HEAD")

            echo "api_snapshot_only_commits=$SNAPSHOT_ONLY"
            echo "api_other_local_commits=$OTHER"
            if [ "$OTHER" -ne 0 ]; then
              echo '::error::API contient au moins un commit local applicatif/non-snapshot. Reconciliation refusee.'
              exit 21
            fi

            git bundle create "$BACKUP/api/local-branch-before.bundle" "$BRANCH"
            git bundle verify "$BACKUP/api/local-branch-before.bundle"
            printf '%s\n' "$API_START" > "$BACKUP/api/local-head-before.txt"
            printf '%s\n' "$API_REMOTE" > "$BACKUP/api/remote-head-target.txt"

            test "$(git rev-parse HEAD)" = "$API_START"
            test "$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')" = "$API_REMOTE"

            git switch --detach "$API_REMOTE"
            git branch -f "$BRANCH" "$API_REMOTE"
            git switch "$BRANCH"
            test "$(git rev-parse HEAD)" = "$API_REMOTE"

            API_HEAD_BEFORE_SNAPSHOT="$(git rev-parse HEAD)"
            bash scripts/deploy/sync_production.sh
            test "$(git rev-parse HEAD)" = "$API_HEAD_BEFORE_SNAPSHOT"
            test -s /var/lib/fundafrica/runtime/PRODUCTION_STATE.json

            API_TRACKED_AFTER="$(git status --porcelain=v1 | grep -v '^?? ' || true)"
            if [ -n "$API_TRACKED_AFTER" ]; then
              echo '::error::API tracked dirty apres reconciliation/snapshot.'
              printf '%s\n' "$API_TRACKED_AFTER"
              exit 22
            fi

            # -----------------------------------------------------------------
            # FRONTEND — la seule modification tracked locale connue est le
            # package-lock. Elle doit etre identique au contenu canonique remote
            # avant que nous la restaurions depuis l ancien HEAD puis fast-forward.
            # -----------------------------------------------------------------
            cd "$FRONT"
            test "$(git branch --show-current)" = "$BRANCH"
            FRONT_START="$(git rev-parse HEAD)"
            git status -sb > "$BACKUP/frontend/status-before.txt"
            git log --format='%H | %cI | %s' -n 80 > "$BACKUP/frontend/log-before.txt"
            cp -a package-lock.json "$BACKUP/frontend/package-lock.before.json"

            FRONT_DIRTY_PATHS="$(git status --porcelain=v1 | grep -v '^?? ' | awk '{print $2}' | sort -u || true)"
            if [ -n "$FRONT_DIRTY_PATHS" ] && [ "$FRONT_DIRTY_PATHS" != 'package-lock.json' ]; then
              echo '::error::Frontend contient des modifications tracked inattendues.'
              printf '%s\n' "$FRONT_DIRTY_PATHS"
              exit 30
            fi

            git fetch --prune origin "$BRANCH"
            FRONT_REMOTE="$(git rev-parse "origin/$BRANCH")"
            FRONT_REMOTE_LS="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
            test "$FRONT_REMOTE" = "$FRONT_REMOTE_LS"

            test "$(git rev-list --count "origin/$BRANCH..HEAD")" = '0'

            if git status --porcelain=v1 | grep -q '^ M package-lock.json$'; then
              LOCAL_LOCK_HASH="$(git hash-object package-lock.json)"
              REMOTE_LOCK_HASH="$(git rev-parse "origin/$BRANCH:package-lock.json")"
              echo "frontend_local_lock_hash=$LOCAL_LOCK_HASH"
              echo "frontend_remote_lock_hash=$REMOTE_LOCK_HASH"
              if [ "$LOCAL_LOCK_HASH" != "$REMOTE_LOCK_HASH" ]; then
                echo '::error::Le package-lock local contient un travail non preserve dans GitHub.'
                exit 31
              fi
              git restore --source=HEAD -- package-lock.json
            fi

            test "$(git rev-parse HEAD)" = "$FRONT_START"
            test "$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')" = "$FRONT_REMOTE"
            git merge --ff-only "origin/$BRANCH"
            test "$(git rev-parse HEAD)" = "$FRONT_REMOTE"

            FRONT_TRACKED_AFTER="$(git status --porcelain=v1 | grep -v '^?? ' || true)"
            if [ -n "$FRONT_TRACKED_AFTER" ]; then
              echo '::error::Frontend tracked dirty apres fast-forward.'
              printf '%s\n' "$FRONT_TRACKED_AFTER"
              exit 32
            fi

            echo '===== FINAL API ====='
            cd "$API"
            echo "branch=$(git branch --show-current)"
            echo "head=$(git rev-parse HEAD)"
            echo "remote=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
            git status -sb
            echo "runtime_snapshot_generated_at=$(node -e "const s=require('/var/lib/fundafrica/runtime/PRODUCTION_STATE.json');process.stdout.write(String(s.generated_at||''))")"

            echo '===== FINAL FRONTEND ====='
            cd "$FRONT"
            echo "branch=$(git branch --show-current)"
            echo "head=$(git rev-parse HEAD)"
            echo "remote=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
            git status -sb

            echo '===== PM2 ====='
            pm2 list

            echo '===== HTTP ====='
            for URL in \
              'https://africafunds.chainsolutions.fr/' \
              'https://africafunds.chainsolutions.fr/home' \
              'https://africafunds.chainsolutions.fr/api/getactualite'; do
              printf '%s -> ' "$URL"
              curl -sS -L --max-redirs 3 --max-time 20 -o /dev/null -w 'HTTP %{http_code} | %{time_total}s | %{url_effective}\n' "$URL"
            done

            echo "RECONCILIATION_BACKUP=$BACKUP"
          REMOTE

      - name: Effacer la cle SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
