# OPS — etape 2, phase seche : rejouer l extraction SEC et mesurer l ecart avec la base.
#
# POURQUOI
# --------
# La mesure du 2026-08-28 recense **233 lignes en rupture d echelle sur 84 fonds**,
# dont **208 portent une source SEC identifiable**. Elles ne se suppriment donc
# pas : elles se corrigent a la source. Le defaut est celui que le lot AI a
# corrige dans l extracteur — la devise etait deduite du NOM du fonds au lieu
# d etre lue dans l en-tete de colonne — mais l historique deja charge en porte
# encore la trace, semaine par semaine, depuis des annees.
#
# Ce workflow ne corrige RIEN. Il repond a une seule question, et par la mesure :
# **si l on rejouait l extraction avec l extracteur corrige, que changerait-elle ?**
#
# Deux etapes, toutes deux sans ecriture en base :
#   1. `sec_ng_nav_extractor_v6.py` rejoue le parsing des fichiers SEC deja
#      presents sur le serveur (aucun telechargement necessaire, ils y sont) ;
#   2. `import_vl_nigeria_sec.js --dry-run` confronte ce resultat a la base et
#      annonce ce qu il modifierait. Le mode dry-run est deja implemente dans
#      l importeur (ligne 215) : il parcourt tout et n ecrit rien.
#
# BORNE VOLONTAIRE : 2022-2026. Les 233 ruptures relevees s y concentrent, et une
# extraction complete depuis 2018 depasserait le temps de job — les anciens .xls
# passent par LibreOffice, lent. La borne est un parametre, pas une limite du
# procede : elle s elargira quand la phase seche aura ete jugee.
#
# CE QU IL FAUT LIRE DANS LE RAPPORT : le nombre de VL que l import corrigerait,
# et surtout combien de mesures il REFUSERAIT pour cause de devise incoherente.
# Un refus n est pas un echec : le contrat d ecriture prefere ne rien ecrire
# plutot qu ecrire un naira etiquete dollar.
#
# Declenchement : bouton Actions, ou push sur ce fichier. Aucun `schedule`.

name: OPS — rejeu SEC etape 2 (phase seche)

on:
  workflow_dispatch:
    inputs:
      annees:
        description: "Annees a rejouer, separees par des espaces"
        required: false
        default: "2026 2025 2024 2023 2022"
        type: string
      reextraire:
        description: "auto = reutiliser le CSV s il date de moins de 24 h · oui = forcer · non = interdire"
        required: false
        default: "auto"
        type: string
  push:
    paths:
      - '.github/workflows/ops-sec-replay-dryrun.yml'
      # Une modification de l importeur, du module partage ou du comparateur doit
      # relancer la mesure : c est elle qui prouve qu ils fonctionnent encore.
      # L importeur tourne chaque lundi ; une regression silencieuse y serait
      # decouverte par l absence de VL, une semaine trop tard.
      - 'scripts/import/import_vl_nigeria_sec.js'
      - 'scripts/diag/ondemand/diag_ecart_csv_base.js'
      - 'src/lib/sec_csv.js'
      - 'scripts/diag/scan_sec_headers.py'

permissions:
  contents: write

concurrency:
  group: ops-sec-replay
  cancel-in-progress: false

jobs:
  replay:
    name: Rejouer l extraction puis simuler l import
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: claude/code-review-improvements-ikvuj

      - name: Verifier les secrets
        env:
          HOST: ${{ secrets.S2_HOST }}
          KEY: ${{ secrets.S2_SSH_KEY }}
        run: |
          # Presence uniquement : aucune valeur n est affichee.
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::Secrets S2_HOST / S2_SSH_KEY manquants."
            exit 1
          fi
          echo "Secrets presents."

      - name: Preparer la connexion SSH
        env:
          HOST: ${{ secrets.S2_HOST }}
          KEY: ${{ secrets.S2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Rejouer puis simuler
        env:
          HOST: ${{ secrets.S2_HOST }}
          USER_SSH: ${{ secrets.S2_USER }}
          ANNEES: ${{ github.event_name == 'workflow_dispatch' && inputs.annees || '2026 2025 2024 2023 2022' }}
          REEXTRAIRE: ${{ github.event_name == 'workflow_dispatch' && inputs.reextraire || 'auto' }}
        run: |
          set -o pipefail
          SSH_USER="${USER_SSH:-root}"
          # ServerAliveInterval : l extraction dure ~8 minutes et sa sortie est
          # filtree par `tail`, donc RIEN ne transite pendant tout ce temps. Une
          # session SSH muette est une session inactive : l execution du
          # 2026-08-28 20:58 est tombee en « client_loop: send disconnect: Broken
          # pipe » a cette etape precise, la precedente etant passee de justesse.
          # Les paquets de maintien tiennent la connexion ouverte sans rien
          # changer au travail distant.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes \
              "$SSH_USER@$HOST" \
            "ANNEES='$ANNEES' REEXTRAIRE='$REEXTRAIRE' bash -s" <<'REMOTE' 2>&1 | tee rapport-replay.txt
            set -u
            API_DIR=/var/www/vhosts/chainsolutions.fr/africafunds.chainsolutions.fr/api
            cd "$API_DIR" || exit 3

            echo "=============================================="
            echo " 0. MISE A JOUR ET VERSION DU CODE"
            echo "=============================================="
            # Ce workflow ne mettait PAS le serveur a jour, contrairement a
            # doc-drift.yml. Il executait donc le code present sur la machine, pas
            # celui qu on venait de pousser : le correctif de la cle de date a ete
            # publie a 21:15 et la mesure de 23:53 a reproduit a l identique le
            # defaut corrige — 40 826 dates « absentes » sur 40 826 — sans que le
            # garde-fou ajoute au meme moment ne se declenche. Il n existait pas
            # sur le serveur.
            git checkout -- logs.txt 2>/dev/null || true
            git pull --rebase origin claude/code-review-improvements-ikvuj 2>&1 | tail -3 \
              || echo "AVERTISSEMENT: mise a jour impossible, mesure lancee sur la version presente."
            git log -1 --format='%h %s' 2>/dev/null || true
            echo "extracteur : $(stat -c '%y' sec_ng_nav_extractor_v6.py 2>/dev/null | cut -d. -f1)"
            echo "annees rejouees : ${ANNEES}"

            echo ""
            echo "=============================================="
            echo " 1. REJEU DE L EXTRACTION"
            echo "=============================================="
            # Sortie dans un fichier DEDIE : sec_ng_latest.csv est le fichier de
            # travail du cron hebdomadaire, l ecraser fausserait le lundi suivant.
            # Reutiliser un CSV recent quand il existe. L extraction est l etape
            # longue et la seule fragile ; la refaire pour comparer deux fois le
            # meme resultat n apporte rien et rejoue le risque de coupure.
            REUTILISE=0
            if [ "${REEXTRAIRE:-auto}" != "oui" ] && [ -s sec_ng_replay.csv ]; then
              AGE_H=$(( ( $(date +%s) - $(stat -c %Y sec_ng_replay.csv) ) / 3600 ))
              if [ "$AGE_H" -lt 24 ] || [ "${REEXTRAIRE:-auto}" = "non" ]; then
                echo "CSV de rejeu existant, ${AGE_H} h — reutilise sans reextraction."
                REUTILISE=1
              fi
            fi

            if [ "$REUTILISE" = "0" ]; then
            rm -f sec_ng_replay.csv
            timeout 2400 python3 sec_ng_nav_extractor_v6.py \
              --years ${ANNEES} \
              --cache-dir sec_ng_downloads \
              --out sec_ng_replay.csv \
              --audit sec_ng_replay_audit.csv \
              --coherence sec_ng_replay_coherence.csv \
              2>&1 | tail -40
            RC=${PIPESTATUS[0]}
            echo "code de sortie extraction : $RC"
            fi

            if [ ! -s sec_ng_replay.csv ]; then
              echo "::error::CSV de rejeu absent ou vide. Simulation impossible."
              exit 4
            fi
            echo "lignes extraites : $(wc -l < sec_ng_replay.csv)"

            echo ""
            echo "=============================================="
            echo " 1bis. LA SEC PUBLIAIT-ELLE DES DOLLARS AVANT 2026 ?"
            echo "=============================================="
            # QUESTION DECISIVE. La devise emise par l extracteur passe de 0 % de
            # dollars en 2022-2025 a 51 % en 2026, sans aucun degrade. Deux causes
            # possibles, et elles n appellent pas le meme remede :
            #   - la SEC a commence a publier une colonne dollar en 2026 : alors
            #     l historique ancien n en contient pas, et rien ne peut le rendre
            #     dollar sans fabriquer des valeurs ;
            #   - ou l extracteur ne sait lire que le format 2026 : alors la donnee
            #     existe et l amputer serait detruire du recuperable.
            # On interroge les fichiers eux-memes plutot que de trancher au flair.
            for AN in 2024 2025 2026; do
              F=$(ls -1 sec_ng_downloads/$AN/*.xlsx 2>/dev/null | head -1)
              echo ""
              echo "--- $AN : ${F:-aucun fichier .xlsx}"
              [ -n "$F" ] && python3 scripts/diag/dump_sec_header_structure.py "$F" 2>&1 | head -22
            done

            echo ""
            echo "=============================================="
            echo " 1ter. BALAYAGE DE TOUS LES FICHIERS SEC"
            echo "=============================================="
            # Trois echantillons ne font pas une preuve : les trois fichiers
            # regardes ci-dessus n ont que des en-tetes (N), mais celui de 2026
            # est le fichier du 10 avril, deja connu pour n avoir aucune colonne
            # dollar — l echantillon designait le cas particulier. Ce balayage
            # ouvre les ~550 fichiers et compte, par annee, combien portent au
            # moins un en-tete en dollars. Le script vit dans le depot plutot que
            # dans ce YAML : un heredoc Python imbrique casse le bloc, et un
            # script versionne se relit, se teste et se corrige.
            timeout 900 python3 scripts/diag/scan_sec_headers.py sec_ng_downloads 2>&1 | tail -40

            echo ""
            echo "=============================================="
            echo " 2. SIMULATION DE L IMPORT (aucune ecriture)"
            echo "=============================================="
            # --dry-run est implemente dans l importeur : il parcourt tout,
            # applique le contrat d ecriture, et n ecrit rien.
            node scripts/import/import_vl_nigeria_sec.js sec_ng_replay.csv --dry-run 2>&1 | tail -80

            echo ""
            echo "=============================================="
            echo " 3. ECART ENTRE LE FICHIER RELU ET LA BASE"
            echo "=============================================="
            # La vraie mesure : l import n ecrit rien sur des dates existantes,
            # donc c est la comparaison valeur par valeur qui dit ce qu une
            # correction redresserait.
            node scripts/diag/ondemand/diag_ecart_csv_base.js sec_ng_replay.csv 2>&1 | head -120

            echo ""
            echo "=============================================="
            echo " 4. RUPTURES ENCORE PRESENTES EN BASE"
            echo "=============================================="
            # Rappel du point de depart : ce que la simulation doit faire reculer.
            node scripts/diag/ondemand/diag_ruptures_restantes.js 2>&1 | head -20
          REMOTE

      - name: Consigner la mesure dans le depot
        if: always()
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p docs
          {
            echo "# Rejeu SEC — etape 2, phase seche"
            echo
            echo "> Genere par \`ops-sec-replay-dryrun.yml\`. Ne pas modifier a la main."
            echo "> **Aucune ecriture en base** : extraction dans un fichier dedie, import en dry-run."
            echo
            echo "Derniere execution : **$(date -u '+%Y-%m-%d %H:%M UTC')**"
            echo
            echo '```'
            cat rapport-replay.txt 2>/dev/null || echo "(aucune sortie — la connexion au serveur a echoue)"
            echo '```'
          } > docs/REJEU_SEC_ETAPE2.md

          git add docs/REJEU_SEC_ETAPE2.md
          if git diff --cached --quiet; then
            echo "Rapport inchange, aucun commit."
          else
            git commit -m "chore(ops): rejeu SEC etape 2 — phase seche $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git pull --rebase origin claude/code-review-improvements-ikvuj || true
            git push origin HEAD:claude/code-review-improvements-ikvuj
            echo "Rapport consigne dans le depot."
          fi

      - name: Effacer la cle SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
