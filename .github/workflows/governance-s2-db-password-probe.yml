name: AfricaFunds MariaDB Password Syntax Probe

on:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - 'scripts/governance/s2_probe_mariadb_password_sql.py'
      - '.github/workflows/governance-s2-db-password-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: africafunds-db-password-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/code-review-improvements-ikvuj

      - name: Prepare strict pinned SSH
        env:
          S2_HOST: ${{ secrets.S2_HOST }}
          S2_SSH_KEY: ${{ secrets.S2_SSH_KEY }}
          S2_KNOWN_HOSTS: ${{ secrets.S2_KNOWN_HOSTS }}
        run: bash scripts/governance/prepare_s2_ssh.sh

      - name: Probe temporary MariaDB account only
        env:
          HOST: ${{ secrets.S2_HOST }}
          USER_SSH: ${{ secrets.S2_USER }}
        run: |
          set -euo pipefail
          SSH_USER="${USER_SSH:-root}"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$HOST" 'python3 -' \
            < scripts/governance/s2_probe_mariadb_password_sql.py \
            > DB_PASSWORD_SQL_PROBE.json
          python3 - <<'PY'
          import json
          p=json.load(open('DB_PASSWORD_SQL_PROBE.json',encoding='utf-8'))
          assert p['project_uid']=='CS-AFRICAFUNDS-001'
          assert p['temporary_account_only'] is True
          assert p['temporary_account_removed'] is True
          assert p['recommended_method']=='SERVER_SIDE_QUOTE_FROM_HEX'
          assert p['secret_values_exposed'] is False
          assert p['business_data_modified'] is False
          print('DB_PASSWORD_SQL_PROBE=PASS')
          PY

      - name: Upload non-sensitive probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africafunds-db-password-sql-probe
          path: DB_PASSWORD_SQL_PROBE.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
