name: Allocation Engine

on:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - 'src/services/allocation/engine/**'
      - 'tests/allocation-engine.test.js'
      - '.github/workflows/governance-allocation-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allocation-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Validate canonical Node solver adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout canonical API
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies without package scripts
        run: npm ci --ignore-scripts

      - name: Syntax check allocation engine
        run: node --check src/services/allocation/engine/adapter.js

      - name: Run deterministic allocation engine tests
        run: npx jest tests/allocation-engine.test.js --runInBand --forceExit
