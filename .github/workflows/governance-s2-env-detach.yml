name: AfricaFunds Detach Tracked Runtime Env

on:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - '.governance/ops/s2-env-detach-request.json'
      - '.github/workflows/governance-s2-env-detach.yml'
      - 'scripts/governance/s2_detach_tracked_env.sh'
      - 'scripts/governance/prepare_s2_ssh.sh'

permissions:
  contents: read

concurrency:
  group: africafunds-s2-env-detach
  cancel-in-progress: false

jobs:
  detach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target governance
        uses: actions/checkout@v4
        with:
          ref: claude/code-review-improvements-ikvuj
          fetch-depth: 2

      - name: Require one-shot versioned authorization
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA_VALUE" \
            | grep -Fxq '.governance/ops/s2-env-detach-request.json' || {
              echo "No one-shot detach request in this commit; safe no-op."
              exit 78
            }
          python3 - <<'PY'
          import json
          p=json.load(open('.governance/ops/s2-env-detach-request.json',encoding='utf-8'))
          assert p['schema_version']=='1.0.0'
          assert p['project_uid']=='CS-AFRICAFUNDS-001'
          assert p['action']=='DETACH_TRACKED_RUNTIME_ENV'
          assert p['confirmation']=='DETACH AFRICAFUNDS TRACKED ENV'
          assert p['one_shot'] is True
          assert p['preserve_exact_runtime_bytes'] is True
          assert p['restart_services'] is False
          print('VERSIONED_ENV_DETACH_REQUEST=PASS')
          PY

      - name: Ensure target Git tree no longer tracks .env
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env still tracked in target tree"
            exit 2
          fi

      - name: Prepare strict pinned SSH
        env:
          S2_HOST: ${{ secrets.S2_HOST }}
          S2_SSH_KEY: ${{ secrets.S2_SSH_KEY }}
          S2_KNOWN_HOSTS: ${{ secrets.S2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash scripts/governance/prepare_s2_ssh.sh

      - name: Backup, fast-forward, restore runtime-only .env
        env:
          HOST: ${{ secrets.S2_HOST }}
          USER_SSH: ${{ secrets.S2_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_USER="${USER_SSH:-root}"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$HOST" "bash -s -- '$TARGET_SHA'" \
            < scripts/governance/s2_detach_tracked_env.sh | tee env-detach-result.txt

      - name: Re-inventory runtime without values
        env:
          HOST: ${{ secrets.S2_HOST }}
          USER_SSH: ${{ secrets.S2_USER }}
        run: |
          set -euo pipefail
          SSH_USER="${USER_SSH:-root}"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$HOST" 'python3 -' \
            < scripts/governance/s2_secret_inventory.py > S2_SECRET_INVENTORY_AFTER.json
          python3 - <<'PY'
          import json
          p=json.load(open('S2_SECRET_INVENTORY_AFTER.json',encoding='utf-8'))
          env=p['files']['.env']
          assert env['exists'] is True
          assert env['tracked_by_git'] is False
          assert env['git_status']==[]
          assert p['migration_preconditions']['runtime_env_ignored_if_untracked'] is True
          assert p['safety']['values_exposed'] is False
          print('RUNTIME_ENV_DETACHED_FROM_GIT=PASS')
          PY

      - name: Upload non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africafunds-env-detach-evidence
          path: |
            env-detach-result.txt
            S2_SECRET_INVENTORY_AFTER.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
