name: AfricaFunds Tracked Secret Gate

on:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - '.env'
      - '.env.*'
      - '.gitignore'
      - 'scripts/governance/audit_tracked_secrets.py'
      - '.github/workflows/governance-secret-gate.yml'
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: africafunds-secret-gate
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/code-review-improvements-ikvuj

      - name: Scan tracked environment files without printing values
        run: |
          set +e
          python3 scripts/governance/audit_tracked_secrets.py > secret-audit-output.json
          CODE=$?
          cat secret-audit-output.json
          cp .governance-secret-audit.json tracked-secret-audit.json 2>/dev/null || true
          exit $CODE

      - name: Upload non-sensitive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africafunds-tracked-secret-audit
          path: tracked-secret-audit.json
          if-no-files-found: warn
          retention-days: 30
