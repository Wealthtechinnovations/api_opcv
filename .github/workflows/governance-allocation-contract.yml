name: Allocation Contract

on:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - 'src/services/allocation/**'
      - 'tests/allocation-contract.test.js'
      - 'tests/allocation-route.test.js'
      - 'src/routes/apigestionallocation.js'
      - 'app.js'
      - '.github/workflows/governance-allocation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allocation-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate Node allocation contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout canonical API
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies without package scripts
        run: npm ci --ignore-scripts

      - name: Syntax check allocation contract
        run: |
          node --check src/services/allocation/contract.js
          node --check src/routes/apigestionallocation.js
          node --check app.js

      - name: Run allocation contract and route tests
        run: npx jest tests/allocation-contract.test.js tests/allocation-route.test.js --runInBand --forceExit
