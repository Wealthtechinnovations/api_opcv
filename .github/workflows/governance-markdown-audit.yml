name: AfricaFunds Markdown Exhaustive Audit

on:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - '*.md'
      - '**/*.md'
      - 'scripts/governance/audit_markdown.py'
      - '.governance/schemas/markdown-registry.schema.json'
      - '.github/workflows/governance-markdown-audit.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: africafunds-markdown-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout API canonical branch
        uses: actions/checkout@v4
        with:
          ref: claude/code-review-improvements-ikvuj
          path: api
          fetch-depth: 1

      - name: Checkout frontend canonical branch
        uses: actions/checkout@v4
        with:
          repository: Wealthtechinnovations/front_end_opcvm
          ref: claude/code-review-improvements-ikvuj
          path: frontend
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Read and classify every Markdown file
        run: |
          set -euo pipefail
          mkdir -p out
          python3 api/scripts/governance/audit_markdown.py \
            --api-root api \
            --frontend-root frontend \
            --output out/markdown-registry.json \
            --summary out/markdown-audit-summary.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## AfricaFunds exhaustive Markdown audit'
            echo
            echo '~~~text'
            cat out/markdown-audit-summary.txt 2>/dev/null || echo 'audit did not produce a summary'
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist certified registry on canonical branch
        if: success()
        run: |
          set -euo pipefail
          cp out/markdown-registry.json api/.governance/knowledge/markdown-registry.json
          cd api
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .governance/knowledge/markdown-registry.json
          if git diff --cached --quiet; then
            echo "Registry already current."
            exit 0
          fi
          git fetch origin claude/code-review-improvements-ikvuj
          REMOTE_HEAD="$(git rev-parse origin/claude/code-review-improvements-ikvuj)"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
            echo "::error::HEAD moved during audit: local=$LOCAL_HEAD remote=$REMOTE_HEAD. Refusing write."
            exit 2
          fi
          git commit -m "chore(governance): certify all current Markdown [skip ci]"
          git push origin HEAD:claude/code-review-improvements-ikvuj

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africafunds-markdown-audit
          path: |
            out/markdown-registry.json
            out/markdown-audit-summary.txt
          if-no-files-found: error
          retention-days: 30
