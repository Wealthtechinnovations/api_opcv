name: OPS — observer S2 read-only

on:
  workflow_dispatch:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - 'scripts/governance/s2_observe.py'
      - 'scripts/governance/prepare_s2_ssh.sh'
      - '.governance/ssh/s2_known_hosts.tofu'
      - '.governance/ssh/s2_hostkey_trust.json'
      - '.github/workflows/ops-s2-observe.yml'

permissions:
  contents: read

concurrency:
  group: ops-s2-observe
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout canonical API governance
        uses: actions/checkout@v4
        with:
          ref: claude/code-review-improvements-ikvuj

      - name: Prepare strict pinned SSH
        env:
          S2_HOST: ${{ secrets.S2_HOST }}
          S2_SSH_KEY: ${{ secrets.S2_SSH_KEY }}
          S2_KNOWN_HOSTS: ${{ secrets.S2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash scripts/governance/prepare_s2_ssh.sh

      - name: Observe S2 without bridge MCP
        env:
          HOST: ${{ secrets.S2_HOST }}
          USER_SSH: ${{ secrets.S2_USER }}
        run: |
          set -euo pipefail
          SSH_USER="${USER_SSH:-root}"
          ssh -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$HOST" \
            'python3 -' < scripts/governance/s2_observe.py > S2_OBSERVATION.json

      - name: Validate observation evidence
        run: |
          set -euo pipefail
          python3 -m json.tool S2_OBSERVATION.json >/dev/null
          python3 - <<'PY'
          import json
          p=json.load(open('S2_OBSERVATION.json',encoding='utf-8'))
          assert p['project_uid']=='CS-AFRICAFUNDS-001'
          assert p['safety']['read_only_observer'] is True
          assert p['safety']['arbitrary_remote_shell'] is False
          assert p['safety']['production_mutation_performed'] is False
          for role in ('api','frontend'):
              assert p['git'][role]['expected_branch']=='claude/code-review-improvements-ikvuj'
          print('S2 observation evidence: PASS')
          PY

      - name: Publish safe summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          print('## AfricaFunds — S2 read-only observation')
          pth=pathlib.Path('S2_OBSERVATION.json')
          if not pth.exists():
              print('Observation unavailable: see job logs.')
          else:
              p=json.loads(pth.read_text())
              for role in ('api','frontend'):
                  g=p['git'][role]
                  print(f"- {role}: branch={g.get('branch')} head={g.get('head')} remote={g.get('remote_head')} alignment={g.get('remote_alignment')}")
              print('- PM2:', p.get('runtime',{}).get('pm2'))
              print('- DB:', p.get('database',{}).get('connectivity'))
              for h in p.get('http',[]):
                  print(f"- HTTP {h.get('url')}: {h.get('http_code')}")
          PY

      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africafunds-s2-observation
          path: S2_OBSERVATION.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
